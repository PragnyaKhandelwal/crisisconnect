services:
  - type: web
    name: crisisconnect
    runtime: docker
    plan: free
    healthCheckPath: /api/stats
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: GEOCODE_COUNTRY
        value: in
      - key: GROQ_API_KEY
        sync: false
